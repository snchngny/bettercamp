name: Windows launcher tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 regression tests
        shell: powershell
        run: ./tests/Test-BetterCamp.ps1
